<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 2 - State Polity | CBT Interface</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        html, body { width: 100%; height: 100%; }
        body { background-color: #f4f5f8; color: #333; display: flex; flex-direction: column; }

        /* Header (Official Blue) */
        header { background: #2563eb; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); z-index: 10; flex-shrink: 0;}
        .exam-title { font-size: 1.2rem; font-weight: bold; }
        .timer-box { font-size: 1.1rem; font-weight: bold; background: #fff; color: #dc2626; padding: 5px 15px; border-radius: 4px; border: 1px solid #ccc;}

        .main-container { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        
        /* Left Panel - Question Area */
        .left-panel { flex: 1; display: flex; flex-direction: column; background: #fff; position: relative; border-right: 2px solid #ddd; overflow: hidden; }
        .q-header { background: #f8f9fa; padding: 12px 20px; border-bottom: 1px solid #ddd; font-weight: bold; font-size: 1.1rem; color: #1e3a8a; display: flex; justify-content: space-between; flex-shrink: 0; }
        .q-content { flex: 1; padding: 20px; overflow-y: auto; font-size: 1.1rem; line-height: 1.6; }
        .q-text { margin-bottom: 20px; font-weight: 600; }
        
        .option-label { display: block; padding: 10px 15px; margin-bottom: 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; transition: 0.1s; background: #fafafa; }
        .option-label:hover { background: #eef2ff; border-color: #2563eb; }
        .option-label input { margin-right: 12px; transform: scale(1.3); cursor: pointer; }

        /* Action Buttons Area */
        .action-footer { background: #f8f9fa; padding: 15px 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; flex-shrink: 0; }
        .btn { padding: 10px 15px; border: 1px solid transparent; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.9rem; flex: 1; min-width: 130px; text-align: center; }
        
        .btn-review { background: #f59e0b; color: #fff; } /* Yellow/Orange */
        .btn-clear { background: #fff; color: #333; border-color: #ccc; }
        .btn-prev { background: #e5e7eb; color: #333; border-color: #ccc; }
        .btn-save { background: #22c55e; color: #fff; } /* Green */

        /* Right Panel - Palette Area */
        .right-panel { width: 320px; background: #eef2ff; display: flex; flex-direction: column; overflow: hidden; }
        .candidate-info { padding: 15px; background: #dbeafe; border-bottom: 1px solid #bfdbfe; text-align: center; font-weight: bold; color: #1e3a8a; flex-shrink: 0; }
        
        /* Status Legends */
        .legends { padding: 10px; background: #fff; border-bottom: 1px solid #ddd; font-size: 0.8rem; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 20px; height: 20px; border-radius: 4px; display: inline-block; color: white; text-align: center; line-height: 20px; font-size: 0.7rem; font-weight: bold;}
        
        .palette-container { padding: 15px; flex: 1; overflow-y: auto; background: #fff; }
        .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        
        /* Palette Buttons */
        .p-btn { width: 45px; height: 45px; border-radius: 4px; border: 1px solid #ccc; background: #f3f4f6; font-weight: bold; color: #333; cursor: pointer; font-size: 1rem; }
        
        /* SSC Colors */
        .status-ans { background: #22c55e !important; color: #fff !important; border-color: #16a34a !important; } /* Green */
        .status-not-ans { background: #ef4444 !important; color: #fff !important; border-color: #dc2626 !important; border-radius: 50% 50% 0 0 !important; } /* Red (Dome shape typical in TCS) */
        .status-not-visited { background: #e5e7eb !important; color: #333 !important; } /* Grey */
        .status-review { background: #9333ea !important; color: #fff !important; border-color: #7e22ce !important; border-radius: 50% !important; } /* Purple */

        .submit-section { padding: 15px; background: #dbeafe; border-top: 1px solid #bfdbfe; flex-shrink: 0; }
        .btn-submit { width: 100%; padding: 12px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-submit:hover { background: #1d4ed8; }

        /* Result Screen */
        .result-screen { display: none; padding: 30px 15px; background: #fff; overflow-y: auto; }
        .score-box { max-width: 600px; margin: 0 auto; background: #f8f9fa; border: 2px solid #2563eb; border-radius: 8px; padding: 30px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .score-box h2 { color: #1e3a8a; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-item { background: #fff; padding: 15px; border-radius: 4px; border: 1px solid #ddd; font-size: 1.1rem; }
        .btn-home { display: inline-block; padding: 12px 25px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 4px; margin-top: 25px; font-weight: bold; }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .right-panel { width: 100%; border-top: 3px solid #2563eb; flex: 0 0 220px; } /* Fixed height on mobile for palette */
            .action-footer { flex-wrap: wrap; }
            .btn { min-width: 45%; }
            .p-btn { width: 38px; height: 38px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <header id="header">
        <div class="exam-title">SSC/Railway Format - Mock Test 2</div>
        <div class="timer-box">Time Left: <span id="timer">30:00</span></div>
    </header>

    <div class="main-container" id="test-screen">
        
        <!-- Left Panel: Questions -->
        <div class="left-panel">
            <div class="q-header">
                <span>Question No. <span id="q-num-display">1</span></span>
                <span style="color: #dc2626;">Marks: +2, -0.66</span>
            </div>
            <div class="q-content">
                <div class="q-text" id="q-text">Loading question...</div>
                <div id="options-container"></div>
            </div>
            
            <div class="action-footer">
                <button class="btn btn-review" onclick="markReviewAndNext()">Mark for Review & Next</button>
                <button class="btn btn-clear" onclick="clearResponse()">Clear Response</button>
                <button class="btn btn-prev" onclick="prevQuestion()">Previous</button>
                <button class="btn btn-save" id="btn-next" onclick="saveAndNext()">Save & Next</button>
            </div>
        </div>

        <!-- Right Panel: Palette -->
        <div class="right-panel">
            <div class="candidate-info">Rajasthan State Polity</div>
            
            <div class="legends">
                <div class="legend-item"><div class="legend-box status-ans">0</div> Answered</div>
                <div class="legend-item"><div class="legend-box status-not-ans">0</div> Not Answered</div>
                <div class="legend-item"><div class="legend-box status-not-visited">0</div> Not Visited</div>
                <div class="legend-item"><div class="legend-box status-review">0</div> Marked for Review</div>
            </div>

            <div class="palette-container">
                <div class="palette-grid" id="palette-grid"></div>
            </div>

            <div class="submit-section">
                <button class="btn-submit" onclick="submitTest()">SUBMIT TEST</button>
            </div>
        </div>

    </div>

    <!-- Result Screen -->
    <div class="result-screen" id="result-screen">
        <div class="score-box">
            <h2>Test Submitted Successfully!</h2>
            <p id="rank-text" style="font-size: 1.2rem; font-weight: bold; color: #dc2626;"></p>
            <div class="stats-grid">
                <div class="stat-item">Total Score<br><strong id="res-score" style="color:#2563eb; font-size:1.5rem;">0</strong></div>
                <div class="stat-item">Attempted<br><strong id="res-attempted">0</strong></div>
                <div class="stat-item">Correct (+2)<br><strong id="res-correct" style="color:#22c55e;">0</strong></div>
                <div class="stat-item">Wrong (-0.66)<br><strong id="res-wrong" style="color:#dc2626;">0</strong></div>
            </div>
            <a href="index.html" class="btn-home">Back to Dashboard</a>
        </div>
    </div>

    <script>
        const questions = [
            { q: "Through which Constitutional Amendment was it added to the Constitution that a person can be appointed Governor of two or more states?", options: ["Fourth Amendment, 1955", "Seventh Amendment, 1956", "Eighth Amendment, 1960", "Ninth Amendment, 1960"], ans: 1 },
            { q: "Consider the following statements and select the correct answer:\n(1) The Governor shall take and make an oath or affirmation before assuming his office.\n(2) The form of oath or affirmation shall be as prescribed in the Third Schedule.", options: ["Both (1) and (2) are correct", "Both (1) and (2) are incorrect", "Only (1) is correct", "Only (2) is correct"], ans: 0 },
            { q: "On whose recommendation was the post of Rajpramukh abolished in Rajasthan and the post of Governor established?", options: ["State Legislative Assembly", "Constituent Assembly", "President of India", "Chief Minister"], ans: 2 },
            { q: "Who among the following Governors of Rajasthan was a member of the Rajasthan Public Service Commission before becoming the Governor?", options: ["Sukhdev Prasad", "Raghukul Tilak", "Hari Singh Gour", "Gulab Chand Kataria"], ans: 0 },
            { q: "In which of the following landmark cases did the Supreme Court rule that the Governor does not have the power to convene a session of the Legislative Assembly without the aid and advice of the Council of Ministers?", options: ["Samsher Singh v. State of Punjab", "Rameshwar Prasad v. Union of India", "Kesavananda Bharati v. State of Kerala", "Badri Prasad Yadav v. State of Rajasthan"], ans: 0 },
            { q: "Select the constitutional duties of the Chief Minister from the following:\n(a) The Chief Minister communicates the decisions regarding the administration of the state's affairs to the Governor.\n(b) The Chief Minister furnishes to the Governor such information relating to the administration of the state.\n(c) The Chief Minister has the power to remove any minister without consulting the Governor.", options: ["(a) and (b)", "(b) and (c)", "(a), (b), and (c)", "Only (a)"], ans: 0 },
            { q: "Which of the following Chief Ministers has NOT held the post of Leader of Opposition in the Rajasthan Legislative Assembly?\n(a) Haridev Joshi\n(b) Shivcharan Mathur\n(c) Ashok Gehlot\n(d) Bhairon Singh Shekhawat", options: ["(a)", "(b)", "(c)", "(d)"], ans: 3 },
            { q: "Who among the following has held the post of both Chief Minister and Deputy Chief Minister of Rajasthan?", options: ["Mohanlal Sukhadia", "Tikaram Paliwal", "Haridev Joshi", "Ashok Gehlot"], ans: 2 },
            { q: "Consider the following statements:\n(i) He served as the Chief Minister of Rajasthan.\n(ii) He later became the Speaker of the Rajasthan Legislative Assembly.\n(iii) He also held the post of Deputy Chief Minister.", options: ["Haridev Joshi", "Hari Singh Gour", "Tikaram Paliwal", "Bhairon Singh Shekhawat"], ans: 0 },
            { q: "What is the maximum permissible strength of Ministers in Rajasthan (including the Chief Minister) as per the 91st Constitutional Amendment?", options: ["27", "35", "30", "40"], ans: 2 },
            { q: "How many seats were won by the Ram Rajya Parishad in the first (1952) Rajasthan State Assembly Elections?", options: ["24", "32", "36", "22"], ans: 0 },
            { q: "Which Constitutional Amendment amended Article 171(1) of the Constitution of India to provide that the total number of members of a State Legislative Council shall not exceed 'one-third' of the total number of members in the Legislative Assembly?", options: ["89th Amendment", "90th Amendment", "91st Amendment", "92nd Amendment"], ans: 1 },
            { q: "Who among the following has held the posts of Pro-tem Speaker, Speaker, and Deputy Speaker in the Rajasthan Legislative Assembly?", options: ["Poonam Chand Vishnoi", "Niranjan Nath Seetharam", "Vijaypal Singh Mankotia", "Kailash Chandra Meghwal"], ans: 3 },
            { q: "Who among the following was the first non-Congress Speaker of the Rajasthan Legislative Assembly?", options: ["Gopal Singh", "Shantilal Chaplot", "Harishchandra Bhabhra", "Laxminarayan Pandya"], ans: 2 },
            { q: "Which of the following is NOT included in the definition of a Money Bill under Article 199 of the Constitution of India?", options: ["The imposition, abolition, remission, alteration or regulation of any tax", "The borrowing of money on the credit of the state", "The custody of the Consolidated Fund of the state", "The delegation of power"], ans: 3 },
            { q: "Who is the ex-officio Chairman of the Business Advisory Committee of the Rajasthan Legislative Assembly?", options: ["Speaker of the Legislative Assembly", "Leader of the House", "Chief Minister", "Leader of the Opposition"], ans: 0 },
            { q: "Who among the following was the first woman member (MLA) of the Rajasthan Legislative Assembly?", options: ["Ganga Devi", "Yashoda Devi", "Sumitra Singh", "Kamla Beniwal"], ans: 0 },
            { q: "Who among the following became the first woman Speaker of the Rajasthan Legislative Assembly?", options: ["Vasundhara Raje", "Kamla Beniwal", "Yashoda Devi", "Sumitra Singh"], ans: 1 },
            { q: "What is the total sanctioned strength of Judges in the Rajasthan High Court?", options: ["45", "41", "50", "39"], ans: 2 },
            { q: "Consider the following statements regarding the Jaipur Bench of the Rajasthan High Court:\n(a) The permanent bench of the Rajasthan High Court was established in 1977.\n(b) The Jaipur Bench was established as an additional bench.", options: ["Both (a) and (b) are correct", "Both (a) and (b) are incorrect", "Only (a) is correct", "Only (b) is correct"], ans: 0 },
            { q: "On which date was the Rajasthan High Court inaugurated by Rajpramukh Maharaja Sawai Man Singh?", options: ["29 August, 1949", "28 January, 1950", "27 March, 1951", "28 January, 1952"], ans: 2 },
            { q: "In 1958, the Jaipur Bench of the Rajasthan High Court was abolished on the recommendation of the P. Satyanarayan Rao Committee. Who among the following was NOT a member of this committee?", options: ["Justice M.C. Mahajan", "Justice K.L. Gajapati Rao", "K.R. Nayar", "H.C. Mitter"], ans: 1 },
            { q: "Who administers the oath of office to a Judge of a common High Court functioning for two or more States?", options: ["By the President", "By the Governors of all the States jointly", "By the Chief Justice of India", "By the Chief Justice of the High Court"], ans: 2 },
            { q: "Who among the following political scientists/analysts termed the District Magistrate as an 'institutional charisma'?", options: ["Rajni Kothari", "P.R. Dubhashi", "T.N. Chaturvedi", "Rudolph and Rudolph"], ans: 0 },
            { q: "In which years was the post of Divisional Commissioner abolished and subsequently re-established in Rajasthan?", options: ["Abolished in 1962 and re-established in 1971", "Abolished in 1959 and re-established in 1967", "Abolished in 1960 and re-established in 1972", "Abolished in 1961 and re-established in 1970"], ans: 0 },
            { q: "In which two districts of Rajasthan was the Police Commissionerate system first implemented?", options: ["Jaipur and Ajmer", "Jaipur and Jodhpur", "Udaipur and Jaipur", "Jaipur and Bikaner"], ans: 0 },
            { q: "Under which Act was the District Collector designated as the Chairperson of the District Disaster Management Authority?", options: ["Disaster Management Act, 2004", "Disaster Management Act, 2005", "Disaster Mitigation Act, 2003", "Crisis Management Act, 2006"], ans: 0 },
            { q: "Prior to the integration of Rajasthan, which three princely states had functional Public Service Commissions?", options: ["Jhalawar, Banswara and Dungarpur", "Jodhpur, Jaipur and Bikaner", "Kota, Mewar and Marwar", "Jaisalmer, Nagaur and Pali"], ans: 1 },
            { q: "In which year was the office of the Rajasthan Public Service Commission shifted from Jaipur to Ajmer following the recommendation of the P. Satyanarayan Rao Committee?", options: ["1958", "1960", "1961", "1962"], ans: 1 },
            { q: "Who among the following held the longest tenure as the Chairman of the Rajasthan Public Service Commission?", options: ["Mohammad Yakub", "Yatindra Singh", "D.S. Tiwari", "C.R. Karnani"], ans: 0 },
            { q: "The Chairman or a member of the Rajasthan Public Service Commission can be suspended from office by:", options: ["Chief Minister of Rajasthan", "Chief Secretary of Rajasthan", "Governor on the recommendation of the PSC", "President of India on the recommendation of the Governor"], ans: 3 },
            { q: "What is the tenure of a member of the Rajasthan Public Service Commission?", options: ["5 years or 62 years of age, whichever is earlier", "6 years or 62 years of age, whichever is earlier", "7 years or 65 years of age, whichever is earlier", "4 years or 60 years of age, whichever is earlier"], ans: 1 },
            { q: "Consider the following statements regarding the State Election Commission of Rajasthan:\n(a) It was constituted in July 1994 under Article 243K of the Indian Constitution.\n(b) It is responsible for conducting local body elections.", options: ["Both (a) and (b) are correct", "Both (a) and (b) are incorrect", "Only (a) is correct", "Only (b) is correct"], ans: 0 },
            { q: "The State Election Commission of Rajasthan is:", options: ["A statutory body", "An executive body", "A constitutional body", "A division of the Election Commission of India"], ans: 2 },
            { q: "The Committee constituted to recommend the appointment of the Chairperson of the State Human Rights Commission is headed by:", options: ["Chief Minister of the State", "Home Minister of the State", "Chief Justice of the High Court", "Governor of the State"], ans: 3 },
            { q: "How many members (excluding the Chairperson) are provided for in the State Human Rights Commission under the Protection of Human Rights (Amendment) Act, 2006?", options: ["4", "3", "5", "6"], ans: 0 },
            { q: "Consider the following statements regarding the Rajasthan State Human Rights Commission:\n(a) It was constituted by a notification of the Rajasthan Government on January 18, 1999.\n(b) Justice G.D. Gupta was its first Chairperson.", options: ["Both (a) and (b) are correct", "Both (a) and (b) are incorrect", "Only (a) is correct", "Only (b) is correct"], ans: 0 },
            { q: "Who among the following held the office of Chairperson of the Rajasthan State Human Rights Commission for the shortest tenure?", options: ["Justice S. Saghir Ahmad", "Justice Kapil Vatsyayan", "Justice D.B. Bhatt", "Justice M.L. Verma"], ans: 0 },
            { q: "On which date was the Rajasthan State Information Commission constituted?", options: ["12 May 2005", "18 April 2006", "18 November 2006", "2 October 2007"], ans: 1 },
            { q: "Who among the following is NOT a member of the Committee that recommends the appointment of the State Information Commissioners?", options: ["Chief Minister (Chairperson)", "Leader of Opposition", "Chief Secretary", "Advocate General"], ans: 3 },
            { q: "Who among the following does NOT fall within the investigative jurisdiction of the Rajasthan Lokayukta?", options: ["Ministers of State", "Chairperson of Urban Improvement Trust", "Chief Secretary", "Members of Rajasthan Public Service Commission"], ans: 2 },
            { q: "Consider the following statements regarding the Rajasthan Lokayukta:\n(a) The Chief Minister of Rajasthan is outside the jurisdiction of the Lokayukta.\n(b) The Accountant General of Rajasthan is within the jurisdiction.", options: ["Both (a) and (b) are correct", "Both (a) and (b) are incorrect", "Only (a) is correct", "Only (b) is correct"], ans: 1 },
            { q: "Consider the following statements regarding the Lokayukta in Rajasthan:\n(i) The institution of Lokayukta was established in Rajasthan in the year 1973.\n(ii) Justice I.D. Dua was its first Chairperson.", options: ["Both (i) and (ii) are correct", "Both (i) and (ii) are incorrect", "Only (i) is correct", "Only (ii) is correct"], ans: 0 },
            { q: "Rajasthan was the first state in India to enact which of the following Acts to ensure grievance redressal?", options: ["Transparency in Public Procurement Act", "Guaranteed Delivery of Public Services Act", "Public Grievances Redressal Act", "Citizen Charter Act"], ans: 1 },
            { q: "The landmark Supreme Court judgment in 'Vishaka and others vs. State of Rajasthan' is related to:", options: ["Policy for reservation of women in elections", "Maternity benefits for working women", "Sexual harassment of women at workplace", "Equal pay for equal work"], ans: 2 },
            { q: "Which states were the first to adopt the Panchayati Raj system in India?", options: ["Rajasthan and Madhya Pradesh", "Andhra Pradesh and Madhya Pradesh", "Rajasthan and Andhra Pradesh", "Rajasthan and Gujarat"], ans: 2 },
            { q: "Under which Article of the Constitution of India is the State Finance Commission for Panchayats constituted?", options: ["Article 243-I", "Article 243-D", "Article 243-B", "Article 243-J"], ans: 0 },
            { q: "Who acts as the ex-officio Chairman of the District Planning Committee (DPC) in Rajasthan?", options: ["District Collector", "Chief Executive Officer of Zila Parishad", "Member Secretary", "Chief Development Officer"], ans: 0 },
            { q: "Who was the first Chief Secretary of Rajasthan?", options: ["Kishan Puri", "Bhagwat Singh Mehta", "K. Radhakrishnan", "S.W. Shiveshwarkar"], ans: 2 },
            { q: "The Chief Secretary of the State is described as the 'residual legatee'. What does this term imply?", options: ["He performs all administrative functions that are not specifically assigned to any other department", "He has authority to override all other officials", "He is responsible for financial decisions", "He serves as an advisor to the Chief Minister only"], ans: 0 }
        ];

        // --- SSC/Railway CBT LOGIC ---

        let currentQ = 0;
        // status array can be: 'not-visited', 'not-ans', 'ans', 'review'
        let qStatus = new Array(questions.length).fill('not-visited'); 
        let userAnswers = new Array(questions.length).fill(null);
        
        let timeLeft = 30 * 60; // 30 mins
        let timerInterval;

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) { 
                    clearInterval(timerInterval); submitTest(); return; 
                }
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
                timeLeft--;
            }, 1000);
        }

        function initPalette() {
            const grid = document.getElementById('palette-grid');
            grid.innerHTML = '';
            for(let i = 0; i < questions.length; i++) {
                let btn = document.createElement('button');
                btn.className = 'p-btn status-not-visited';
                btn.innerText = i + 1;
                btn.id = 'pbtn-' + i;
                btn.onclick = () => {
                    // Save current before jumping without marking green/purple (just red if empty)
                    if(qStatus[currentQ] === 'not-visited') qStatus[currentQ] = 'not-ans';
                    loadQuestion(i);
                };
                grid.appendChild(btn);
            }
        }

        function updatePaletteCounts() {
            let ans = 0, notAns = 0, notVisited = 0, review = 0;
            for(let i = 0; i < questions.length; i++) {
                let btn = document.getElementById('pbtn-' + i);
                btn.className = 'p-btn'; // reset
                
                if(qStatus[i] === 'ans') { btn.classList.add('status-ans'); ans++; }
                else if(qStatus[i] === 'not-ans') { btn.classList.add('status-not-ans'); notAns++; }
                else if(qStatus[i] === 'review') { btn.classList.add('status-review'); review++; }
                else { btn.classList.add('status-not-visited'); notVisited++; }
            }
            
            // Update the legend counts at the top of palette
            document.querySelector('.status-ans').innerText = ans;
            document.querySelector('.status-not-ans').innerText = notAns;
            document.querySelector('.status-not-visited').innerText = notVisited;
            document.querySelector('.status-review').innerText = review;
        }

        function loadQuestion(index) {
            currentQ = index;
            if(qStatus[currentQ] === 'not-visited') qStatus[currentQ] = 'not-ans'; // Mark as red as soon as visited
            
            document.getElementById('q-num-display').innerText = currentQ + 1;
            document.getElementById('q-text').innerHTML = questions[currentQ].q.replace(/\n/g, '<br>');
            
            let optsHtml = '';
            questions[currentQ].options.forEach((opt, optIndex) => {
                let isChecked = userAnswers[currentQ] === optIndex ? 'checked' : '';
                optsHtml += `
                <label class="option-label">
                    <input type="radio" name="currentOpt" value="${optIndex}" ${isChecked}>
                    ${opt}
                </label>`;
            });
            document.getElementById('options-container').innerHTML = optsHtml;
            updatePaletteCounts();

            if (currentQ === questions.length - 1) {
                document.getElementById('btn-next').innerText = 'Save';
            } else {
                document.getElementById('btn-next').innerText = 'Save & Next';
            }
        }

        function getSelectedOption() {
            const selected = document.querySelector('input[name="currentOpt"]:checked');
            return selected ? parseInt(selected.value) : null;
        }

        function saveAndNext() {
            let sel = getSelectedOption();
            userAnswers[currentQ] = sel;
            
            if(sel !== null) {
                qStatus[currentQ] = 'ans'; // Green
            } else {
                qStatus[currentQ] = 'not-ans'; // Red
            }

            if(currentQ < questions.length - 1) {
                loadQuestion(currentQ + 1);
            } else {
                updatePaletteCounts();
                alert("This is the last question. Click 'SUBMIT TEST' when you are done.");
            }
        }

        function markReviewAndNext() {
            userAnswers[currentQ] = getSelectedOption();
            qStatus[currentQ] = 'review'; // Purple
            
            if(currentQ < questions.length - 1) {
                loadQuestion(currentQ + 1);
            } else {
                updatePaletteCounts();
            }
        }

        function clearResponse() {
            userAnswers[currentQ] = null;
            qStatus[currentQ] = 'not-ans'; // Red
            loadQuestion(currentQ); // Reload options
        }

        function prevQuestion() {
            if(currentQ > 0) {
                if(qStatus[currentQ] === 'not-visited') qStatus[currentQ] = 'not-ans';
                loadQuestion(currentQ - 1);
            }
        }

        function submitTest() {
            if(!confirm("Are you sure you want to final submit the test?")) return;
            
            clearInterval(timerInterval);
            
            let correct = 0; let wrong = 0; let attempted = 0;
            for(let i = 0; i < questions.length; i++) {
                // If question was answered (green) OR reviewed with an answer saved
                if(userAnswers[i] !== null) {
                    attempted++;
                    if(userAnswers[i] === questions[i].ans) { correct++; } 
                    else { wrong++; }
                }
            }

            let score = (correct * 2) - (wrong * 0.66);
            score = Math.max(0, score).toFixed(2);
            let simRank = Math.floor(Math.random() * 50) + 1; 

            document.getElementById('header').style.display = 'none';
            document.getElementById('test-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';

            document.getElementById('res-score').innerText = `${score} / 100`;
            document.getElementById('res-attempted').innerText = attempted;
            document.getElementById('res-correct').innerText = correct;
            document.getElementById('res-wrong').innerText = wrong;
            document.getElementById('rank-text').innerText = `Your Rank: ${simRank}`;
        }

        // Init
        initPalette();
        loadQuestion(0);
        startTimer();
    </script>
</body>
</html>
