let currentQuestion=0,userAnswers=new Array(questions.length).fill(null),timeLeft=120*60,timerInterval=null,submitted=false;

function init(){
 buildPalette(); showQuestion(0); startTimer();
}
function buildPalette(){
 const grid=document.getElementById("palette-grid"),modal=document.getElementById("modal-palette-grid");
 grid.innerHTML="";modal.innerHTML="";
 questions.forEach((q,i)=>{
  const b=document.createElement("button");b.className="p-btn";b.id="p-"+i;b.textContent=i+1;b.onclick=()=>showQuestion(i);grid.appendChild(b);
  const m=b.cloneNode(true);m.id="mp-"+i;m.onclick=()=>{showQuestion(i);closeModal()};modal.appendChild(m);
 });
}
function updatePalette(){
 questions.forEach((q,i)=>{
  ["p-"+i,"mp-"+i].forEach(id=>{
   const b=document.getElementById(id);if(!b)return;
   b.className="p-btn";
   if(i===currentQuestion)b.style.outline="2px solid var(--gold)";else b.style.outline="none";
   if(userAnswers[i]!==null)b.classList.add("p-ans");else b.classList.add("p-not-ans");
  });
 });
}
function showQuestion(i){
 currentQuestion=i;
 document.getElementById("q-num-display").textContent=i+1;
 document.getElementById("q-text").textContent=questions[i].q;
 const box=document.getElementById("options-container");box.innerHTML="";
 questions[i].o.forEach((opt,n)=>{
  const label=document.createElement("label");label.className="option-label";
  label.innerHTML='<input type="radio" name="answer" value="'+n+'"> <b>('+String.fromCharCode(65+n)+')</b> '+opt;
  const r=label.querySelector("input");if(userAnswers[i]===n)r.checked=true;
  r.onchange=()=>{userAnswers[i]=n;updatePalette()};box.appendChild(label);
 });
 updatePalette();
}
function nextQuestion(){if(currentQuestion<questions.length-1)showQuestion(currentQuestion+1)}
function prevQuestion(){if(currentQuestion>0)showQuestion(currentQuestion-1)}
function saveAndNext(){nextQuestion()}
function clearResponse(){userAnswers[currentQuestion]=null;showQuestion(currentQuestion)}
function openModal(){document.getElementById("jumpModal").style.display="flex"}
function closeModal(){document.getElementById("jumpModal").style.display="none"}
function startTimer(){
 timerInterval=setInterval(()=>{
  if(timeLeft<=0){clearInterval(timerInterval);submitTest(true);return}
  timeLeft--;
  const m=Math.floor(timeLeft/60),s=timeLeft%60;
  document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
 },1000);
}
window.addEventListener("blur",()=>{
 const w=document.getElementById("warning");w.style.display="block";
 setTimeout(()=>w.style.display="none",4000);
});
function submitTest(auto=false){
 if(submitted)return;
 if(!auto&&!confirm("Are you sure you want to submit the test?"))return;
 submitted=true;clearInterval(timerInterval);
 let correct=0,wrong=0,attempted=0;
 questions.forEach((q,i)=>{
  if(userAnswers[i]!==null){attempted++;if(userAnswers[i]===q.a)correct++;else wrong++}
 });
 const score=Math.max(0,correct*2-wrong*0.66);
 document.getElementById("test-screen").style.display="none";
 document.getElementById("result-screen").style.display="block";
 document.getElementById("res-score").textContent=score.toFixed(2);
 document.getElementById("res-attempted").textContent=attempted;
 document.getElementById("res-correct").textContent=correct;
 document.getElementById("res-wrong").textContent=wrong;
 renderReview();
}
function renderReview(){
 const box=document.getElementById("review-container");box.innerHTML="";
 questions.forEach((q,i)=>{
  const card=document.createElement("div");card.className="review-card";
  let html='<div class="review-q">Q'+(i+1)+'. '+q.q+'</div>';
  q.o.forEach((opt,n)=>{
   let cls="review-opt";
   if(n===q.a)cls+=" opt-correct";
   if(userAnswers[i]===n&&n!==q.a)cls+=" opt-wrong";
   html+='<div class="'+cls+'"><b>('+String.fromCharCode(65+n)+')</b> '+opt+'</div>';
  });
  html+='<div class="review-sol"><b>Correct Answer:</b> '+String.fromCharCode(65+q.a)+' — '+q.o[q.a]+'<br><br><b>Explanation:</b> '+q.e+'</div>';
  card.innerHTML=html;box.appendChild(card);
 });
}
window.onload=init;
</script>
